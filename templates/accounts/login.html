{% extends "base.html" %}

{% block title %}Kirish — Volidam{% endblock %}

{% block content %}
<section class="min-h-[72vh] sm:min-h-[76vh] flex items-center justify-center px-4 py-8 sm:py-12">
    <div class="w-full max-w-md relative">

        <!-- Orqa fondagi mayin suv nuri -->
        <div class="pointer-events-none absolute -top-10 -left-8 w-36 h-36 rounded-full bg-water-200/45 blur-2xl"></div>
        <div class="pointer-events-none absolute -bottom-10 -right-8 w-36 h-36 rounded-full bg-sand-200/45 blur-2xl"></div>

        <!-- Asosiy oval shishasimon kartochka -->
        <div class="water-card relative p-6 sm:p-9">

            <!-- Suv tomchisi belgisi va sarlavha -->
            <div class="text-center mb-7 sm:mb-8">
                <div class="relative mx-auto mb-4 grid place-items-center w-14 h-14 rounded-full bg-gradient-to-br from-water-500 to-water-700 text-sand-200 shadow-pill">
                    <span class="absolute top-2 left-3 w-3 h-3 rounded-full bg-white/30 blur-[1px]"></span>
                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 2.5c3.2 4.1 6.5 7.9 6.5 12a6.5 6.5 0 0 1-13 0c0-4.1 3.3-7.9 6.5-12z"/>
                    </svg>
                </div>

                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-water-900">
                    Xush kelibsiz
                </h1>
                <p class="text-sm text-water-600 mt-1.5 leading-relaxed">
                    Telefon raqamingizni kiriting — sizga bir martalik SMS kod yuboramiz
                </p>
            </div>

            <!-- Forma -->
            <form method="post" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label for="phone" class="block text-xs sm:text-sm font-semibold text-water-800 mb-2 pl-3">
                        Telefon raqami
                    </label>

                    <div class="relative flex items-center">
                        <!-- Telefon ikonkasi -->
                        <span class="pointer-events-none absolute left-4 text-water-500">
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                            </svg>
                        </span>

                        <input
                            id="phone"
                            type="tel"
                            name="phone"
                            inputmode="tel"
                            autocomplete="tel"
                            placeholder="+998 90 123 45 67"
                            required
                            class="w-full rounded-full bg-white/90 border border-water-200/90 pl-12 pr-5 py-3.5 text-base font-medium text-water-900 placeholder:text-water-400/80 shadow-sm outline-none transition duration-200 focus:border-water-500 focus:bg-white focus:ring-4 focus:ring-water-200/50"
                        >
                    </div>
                </div>

                <button
                    type="submit"
                    class="w-full inline-flex items-center justify-center gap-2.5 rounded-full bg-gradient-to-r from-water-500 to-water-600 hover:from-water-600 hover:to-water-700 active:scale-[0.98] text-white text-sm sm:text-base font-semibold py-3.5 px-6 shadow-pill transition duration-200">
                    <span>SMS kod olish</span>
                    <span class="w-2 h-2 rounded-full bg-sand-400"></span>
                </button>
            </form>

            <!-- Pastki izoh -->
            <div class="mt-6 pt-5 border-t border-water-100/90 text-center">
                <p class="text-xs text-water-600/80 leading-relaxed">
                    Davom etish orqali <span class="font-medium text-water-700">Volidam</span> xizmat shartlariga rozilik bildirasiz.
                </p>
            </div>

        </div>
    </div>
</section>
{% endblock %}
